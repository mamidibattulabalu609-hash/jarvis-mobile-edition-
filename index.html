
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #000;
  color: #00ffff;
  font-family: monospace;
}

h1 {
  text-align: center;
  text-shadow: 0 0 15px cyan;
  letter-spacing: 4px;
}

h2 {
  color: cyan;
}

.panel {
  border: 1px solid #00ffff;
  border-radius: 25px;
  padding: 22px;
  margin: 20px auto;
  max-width: 700px;
  box-shadow: 0 0 15px #003d3d;
}

.status-row {
  display: flex;
  justify-content: space-between;
  margin: 25px 0;
  font-size: 17px;
}

.status {
  color: #00ff66;
}

.error {
  color: #ff1744;
}

#chat {
  height: 350px;
  overflow-y: auto;
  padding: 10px;
}

.message {
  padding: 15px;
  margin: 12px 0;
  border-left: 6px solid cyan;
  border-radius: 10px;
  background: #001515;
  color: white;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.user {
  border-left-color: white;
}

.bot {
  border-left-color: cyan;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 18px;
  border: 1px solid cyan;
  border-radius: 15px;
  background: #000;
  color: white;
  font-size: 16px;
}

button {
  padding: 17px;
  border: none;
  border-radius: 15px;
  background: #00e5e5;
  color: black;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.buttons button {
  flex: 1;
  min-width: 100px;
}

.small {
  color: #aaa;
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
<p style="text-align:center">JUST A RATHER VERY INTELLIGENT SYSTEM</p>

<!-- SYSTEM STATUS -->
<div class="panel">

<h2>SYSTEM STATUS</h2>

<div class="status-row">
<span>AI CORE</span>
<span id="aiStatus" class="error">● OFFLINE</span>
</div>

<div class="status-row">
<span>NETWORK</span>
<span id="networkStatus" class="status">● READY</span>
</div>

<div class="status-row">
<span>VOICE</span>
<span id="voiceStatus" class="status">● READY</span>
</div>

<div class="status-row">
<span>MEMORY</span>
<span class="status">● SESSION</span>
</div>

</div>

<!-- CHAT -->
<div class="panel">

<h2>J.A.R.V.I.S CHAT</h2>

<div id="chat">
<div class="message bot">
J.A.R.V.I.S: System ready. Please connect your AI brain.
</div>
</div>

<div class="controls">
<input
id="userInput"
type="text"
placeholder="Ask J.A.R.V.I.S..."
autocomplete="off">
<button onclick="sendMessage()">SEND</button>
</div>

<div class="buttons">
<button onclick="startVoice()">🎤 SPEAK</button>
<button onclick="stopVoice()">■ STOP</button>
<button onclick="setApiKey()">🔑 API KEY</button>
</div>

<p class="small">
J.A.R.V.I.S AI ASSISTANT
</p>

</div>

<script>

// ==================================
// 1. GEMINI CONFIGURATION
// ==================================

const MODEL = "gemini-3.8-flash";

const API_URL =
`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

// API key stays in memory until page refresh.
let API_KEY = "";

// Conversation memory
let history = [];

// ==================================
// 2. API KEY
// ==================================

function setApiKey() {

  const key = prompt("Enter your Gemini API Key:");

  if (key && key.trim()) {

    API_KEY = key.trim();

    document.getElementById("aiStatus").textContent =
      "● KEY ADDED";

    document.getElementById("aiStatus").className =
      "status";

    addMessage("API key added. Ready to connect.", "bot");

  }

}

// ==================================
// 3. CHAT DISPLAY
// ==================================

function addMessage(message, type) {

  const chat = document.getElementById("chat");

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent =
    (type === "user" ? "YOU: " : "J.A.R.V.I.S: ") + message;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

}

// ==================================
// 4. SEND MESSAGE TO GEMINI
// ==================================

async function sendMessage() {

  const input = document.getElementById("userInput");

  const message = input.value.trim();

  if (!message) return;

  if (!API_KEY) {

    addMessage("Please add your Gemini API key first.", "bot");

    return;

  }

  input.value = "";

  addMessage(message, "user");

  const aiStatus = document.getElementById("aiStatus");

  aiStatus.textContent = "● CONNECTING...";
  aiStatus.className = "status";

  try {

    const contents = [
      {
        role: "user",
        parts: [{
          text:
          "You are J.A.R.V.I.S, a helpful AI assistant. " +
          "Reply clearly and politely.\n\n" +
          message
        }]
      }
    ];

    // Include previous conversation
    contents.unshift(...history);

    const response = await fetch(
      `${API_URL}?key=${encodeURIComponent(API_KEY)}`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          contents: contents
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data.error?.message || "Gemini API request failed"
      );

    }

    const reply =
      data.candidates?.[0]?.content?.parts
      ?.map(part => part.text || "")
      .join("")
      .trim();

    if (!reply) {

      throw new Error("Gemini returned an empty response.");

    }

    // Save conversation for this session
    history.push(
      {
        role: "user",
        parts: [{ text: message }]
      },
      {
        role: "model",
        parts: [{ text: reply }]
      }
    );

    addMessage(reply, "bot");

    aiStatus.textContent = "● CONNECTED";
    aiStatus.className = "status";

    speak(reply);

  } catch (error) {

    console.error(error);

    aiStatus.textContent = "● ERROR";
    aiStatus.className = "error";

    addMessage("AI ERROR: " + error.message, "bot");

  }

}

// ==================================
// 5. ENTER KEY SUPPORT
// ==================================

document.getElementById("userInput")
.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

// ==================================
// 6. TEXT TO SPEECH
// ==================================

function speak(text) {

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-IN";
  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);

}

// ==================================
// 7. VOICE RECOGNITION
// ==================================

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {

    document.getElementById("voiceStatus").textContent =
      "● LISTENING";

  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("userInput").value = text;

    sendMessage();

  };

  recognition.onerror = function(event) {

    document.getElementById("voiceStatus").textContent =
      "● " + event.error.toUpperCase();

  };

  recognition.onend = function() {

    document.getElementById("voiceStatus").textContent =
      "● READY";

  };

}

// ==================================
// 8. START VOICE
// ==================================

function startVoice() {

  if (!recognition) {

    addMessage(
      "Voice recognition is not supported by this browser.",
      "bot"
    );

    return;

  }

  try {

    recognition.start();

  } catch (error) {

    addMessage("Voice error: " + error.message, "bot");

  }

}

// ==================================
// 9. STOP VOICE AND SPEECH
// ==================================

function stopVoice() {

  if (recognition) {

    try {
      recognition.stop();
    } catch (error) {}

  }

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

  }

  document.getElementById("voiceStatus").textContent =
    "● STOPPED";

}

// ==================================
// 10. NETWORK STATUS
// ==================================

function updateNetwork() {

  const network =
    document.getElementById("networkStatus");

  if (navigator.onLine) {

    network.textContent = "● READY";
    network.className = "status";

  } else {

    network.textContent = "● OFFLINE";
    network.className = "error";

  }

}

window.addEventListener("online", updateNetwork);
window.addEventListener("offline", updateNetwork);

updateNetwork();

</script>

</body>
</html>
