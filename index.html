
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <h1>J.A.R.V.I.S</h1>
            <p>PERSONAL AI ASSISTANT</p>
        </header>

        <!-- ARC REACTOR -->
        <section class="reactor-section">
            <div class="reactor">
                <div class="reactor-ring">
                    <div class="reactor-core"></div>
                </div>
            </div>
            <h3>SYSTEM ONLINE</h3>
        </section>

        <!-- SYSTEM DIAGNOSTICS -->
        <section class="diagnostics">
            <h2>SYSTEM DIAGNOSTICS</h2>

            <div class="status">
                <span>AI ENGINE</span>
                <strong>● OPERATIONAL</strong>
            </div>

            <div class="status">
                <span>CONNECTION</span>
                <strong>● ONLINE</strong>
            </div>

            <div class="status">
                <span>VOICE INTERFACE</span>
                <strong>● READY</strong>
            </div>

            <div class="status">
                <span>LONG-TERM MEMORY</span>
                <strong>● ACTIVE</strong>
            </div>
        </section>

        <!-- CHATBOX -->
        <section class="chat-container">
            <div id="chat" class="chat-box">
                <div class="message user">
                    YOU: Hello Jarvis
                </div>

                <div class="message ai">
                    J.A.R.V.I.S: Hello! How can I assist you today?
                </div>
            </div>
        </section>

        <!-- COMMAND INPUT -->
        <div class="input-area">
            <input
                type="text"
                id="msg"
                placeholder="Enter a command for J.A.R.V.I.S..."
                autocomplete="off"
            >
        </div>

        <!-- CONTROL BUTTONS -->
        <div class="controls">

            <button id="send">EXECUTE</button>

            <button id="mic" title="Voice Assistant">🎙️</button>

            <button id="camera" title="Camera Vision">📷</button>

            <button id="clear">CLEAR MEMORY</button>

        </div>

        <!-- CAMERA PREVIEW -->
        <div id="cameraContainer" class="camera-container" hidden>
            <video id="cameraPreview" autoplay playsinline></video>
            <button id="capture">CAPTURE IMAGE</button>
            <canvas id="cameraCanvas" hidden></canvas>
        </div>

    </div>

    <script src="script.js"></script>

</body>
            </html>
