<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b101a">

    <title>J.A.R.V.I.S - Mobile Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>MOBILE EDITION</p>
    </header>

    <!-- AI CORE -->
    <main>

        <section class="core-section">

            <div class="core">
                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="center"></div>
            </div>

            <p class="core-text">CORE ACTIVE</p>

        </section>

        <!-- SYSTEM STATUS -->
        <section class="status">

            <h2>SYSTEM STATUS</h2>

            <div class="row">
                <span>AI CORE</span>
                <b class="on">● ONLINE</b>
            </div>

            <div class="row">
                <span>NETWORK</span>
                <b class="on">● ONLINE</b>
            </div>

            <div class="row">
                <span>VOICE</span>
                <b class="off">○ LOCKED</b>
            </div>

            <div class="row">
                <span>MEMORY</span>
                <b class="off">○ LOCKED</b>
            </div>

        </section>

        <!-- CHAT AREA -->
        <section class="chat-section">

            <div
                class="chat"
                id="chat"
                role="log"
                aria-live="polite"
                aria-label="JARVIS conversation">
            </div>

            <!-- INPUT AREA -->
            <div class="input-area">

                <input
                    type="text"
                    id="msg"
                    placeholder="Ask J.A.R.V.I.S..."
                    autocomplete="off"
                    aria-label="Enter your message"
                >

                <button
                    type="button"
                    id="send">
                    SEND
                </button><button id="mic-btn">🎙️</button>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js" defer></script>

</body>
</html>
