
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">

    <title>J.A.R.V.I.S - Mobile Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <h1>J.A.R.V.I.S</h1>
        <p>MOBILE EDITION</p>
    </header>

    <!-- AI CORE -->
    <main>

        <section class="core-section">

            <div class="core" id="core">

                <div class="ring r1"></div>
                <div class="ring r2"></div>
                <div class="ring r3"></div>

                <div class="center"></div>

            </div>

            <p class="core-text" id="coreText">
                CORE ACTIVE
            </p>

        </section>

        <!-- SYSTEM STATUS -->
        <section class="status">

            <h2>SYSTEM STATUS</h2>

            <div class="row">
                <span>AI CORE</span>
                <b class="on" id="aiStatus">● ONLINE</b>
            </div>

            <div class="row">
                <span>NETWORK</span>
                <b class="on" id="networkStatus">● ONLINE</b>
            </div>

            <div class="row">
                <span>VOICE</span>
                <b class="off" id="voiceStatus">○ LOCKED</b>
            </div>

            <div class="row">
                <span>MEMORY</span>
                <b class="off" id="memoryStatus">○ LOCKED</b>
            </div>

        </section>

        <!-- CHAT AREA -->
        <section class="chat-section">

            <h2>AI COMMUNICATION</h2>

            <div class="chat" id="chat" aria-live="polite">
                <div class="bot-message">
                    J.A.R.V.I.S: System ready. Awaiting your command.
                </div>
            </div>

        </section>

        <!-- INPUT AREA -->
        <section class="input-area">

            <input
                type="text"
                id="msg"
                placeholder="Ask J.A.R.V.I.S..."
                autocomplete="off"
            >

            <button id="send" type="button">
                SEND
            </button>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js" defer></script>

</body>
</html>
