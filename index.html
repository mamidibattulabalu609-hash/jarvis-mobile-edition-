<!DOCTYPE html>
<html lang="en">

<head>
    <head>
<!-- ... existing meta tags ... -->
<!-- ADD THESE LINES FOR PWA SUPPORT -->
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- ... rest of head ... -->
    </head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S - Personal AI Assistant</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>PERSONAL AI ASSISTANT</p>

        <div class="topbar-actions">
            <span class="ready-badge"><span class="ready-dot"></span> READY</span>

            <button class="icon-button wake-button" id="wake-btn" type="button"
                    aria-label="Toggle Wake Word" title="Listen for 'Hey Jarvis'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
            </button>

            <span id="wake-status" style="font-size: 0.7rem; color: #888; margin-right: 5px;">WAKE: OFF</span>

            <button class="icon-button clear-button" id="clear-btn" type="button"
                    aria-label="Clear current conversation" title="Clear current conversation">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h16M9 7V4h6v3m3 0-.8 13H6.8L6 7m4 3v6m4-6v6"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- AI CORE -->
    <div class="core">

        <div class="ring r1"></div>

        <div class="ring r2"></div>

        <div class="center"></div>

    </div>

    <p class="core-text" id="system-status">
        SYSTEM READY
    </p>

    <!-- SYSTEM DIAGNOSTICS -->
    <section class="status">

        <h2>SYSTEM DIAGNOSTICS</h2>

        <div class="row">
            <span>AI ENGINE</span>
            <b class="on">● OPERATIONAL</b>
        </div>

        <div class="row">
            <span>CONNECTION</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>VOICE INTERFACE</span>
            <b class="on">● READY</b>
        </div>

        <div class="row">
            <span>LONG-TERM MEMORY</span>
            <b class="on">● ACTIVE</b>
        </div>

    </section>

    <!-- CHAT AREA -->
    <section class="chat" id="chat">

        <div class="msg ai">
            J.A.R.V.I.S: Systems online.
            How may I assist you?
        </div>

    </section>

    <!-- INPUT AREA -->
    <section class="input-area">

        <input
            type="text"
            id="msg"
            placeholder="Enter a command for J.A.R.V.I.S..."
            autocomplete="off"
        >

        <button id="send" type="button">
            EXECUTE
        </button>

        <button
            id="mic-btn"
            type="button"
            aria-label="Activate voice input"
        >
            🎙️
        </button>

        <button
            id="cam-btn"
            type="button"
            aria-label="Analyze image"
        >
            📷
        </button>


        <input
            id="img-input"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
        >

    </section>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
