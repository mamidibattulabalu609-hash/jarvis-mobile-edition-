<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>J.A.R.V.I.S Voice Edition</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>MOBILE VOICE EDITION</p>
  </header>

  <!-- AI CORE -->
  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="center"></div>
  </div>

  <p class="core-text">CORE ACTIVE</p>

  <!-- SYSTEM STATUS -->
  <section class="status">
    <h2>SYSTEM STATUS</h2>

    <div class="row">
      <span>AI CORE</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>NETWORK</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>VOICE</span>
      <b class="on" id="voiceStatus">● READY</b>
    </div>

    <div class="row">
      <span>MEMORY</span>
      <b class="off">○ LOCKED</b>
    </div>
  </section>

  <!-- CHAT -->
  <section class="chat" id="chat" aria-live="polite">
    <div class="msg ai">
      J.A.R.V.I.S: Hello Boss. Voice system ready.
    </div>
  </section>

  <!-- TEXT INPUT -->
  <div class="input-area">
    <input
      type="text"
      id="msg"
      placeholder="Ask J.A.R.V.I.S..."
      autocomplete="off"
    >

    <button id="send">SEND</button>
  </div>

  <!-- VOICE CONTROLS -->
  <div class="voice-area">

    <button id="voiceBtn" type="button">
      🎤 SPEAK
    </button>

    <button id="stopVoice" type="button">
      ■ STOP
    </button>

  </div>

  <p class="voice-info" id="voiceInfo">
    Press SPEAK and talk to J.A.R.V.I.S
  </p>

  <script src="./script.js"></script>

</body>
</html>
